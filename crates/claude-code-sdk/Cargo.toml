[package]
name = "claude-code-sdk"
version = "0.4.0"
edition = "2024"
authors = ["LuxQuant"]
license = "MIT"
description = "Rust SDK for interacting with Claude Code CLI"
repository = "https://github.com/ry-ht/ryht"
readme = "README.md"
keywords = ["claude", "ai", "sdk", "cli", "mcp"]
categories = ["api-bindings", "asynchronous", "development-tools"]

[features]
default = []
async-discovery = []

[dependencies]
# Workspace dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
dirs.workspace = true

# Local dependencies
mcp-sdk = { path = "../mcp-sdk" }

# External dependencies
tokio-stream = { version = "0.1.17", features = ["sync"] }
bytes = "1.10.1"
pin-project-lite = "0.2.16"
log = "0.4.28"
which = "8.0.0"
async-stream.workspace = true
rand = "0.9.2"
crossbeam-channel = "0.5"
base64 = "0.22"
tiktoken-rs = "0.7.0"
lazy_static = "1.5"

[dev-dependencies]
tokio-test = "0.4.4"
tracing-subscriber.workspace = true
tempfile.workspace = true
proptest = "1.9.0"
criterion = { version = "0.7.0", features = ["html_reports"] }

# [[bench]]
# name = "binary_discovery_bench"
# harness = false
#
# [[bench]]
# name = "session_bench"
# harness = false
#
# [[bench]]
# name = "serialization_bench"
# harness = false
#
