[workspace]
resolver = "2"

members = [
    "axon",
    "crates/*",
    "cortex/cortex-core",
    "cortex/cortex-storage",
    "cortex/cortex-vfs",
    "cortex/cortex-ingestion",
    "cortex/cortex-memory",
    "cortex/cortex-semantic",
    "cortex/cortex-code-analysis",
    "cortex/cortex",
    "cortex/cortex-orchestration",
    "cortex/cortex-agents",
    "cortex/cortex-runtime",
    "cortex/cortex-coordination",
    "cortex/cortex-consensus",
    "cortex/cortex-intelligence",
    "cortex/cortex-quality",
    "cortex/cortex-monitoring",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["LuxQuant"]
license = "MIT"
repository = "https://github.com/ry-ht/ryht"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["full"] }
async-trait = "0.1.89"
futures = "0.3.31"
async-stream = "0.3.6"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
schemars = { version = "1.0.5", features = ["preserve_order"] }
bincode = "2.0.1"

# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing-appender = "0.2.3"

# HTTP/Web
# CRITICAL: Axum locked to 0.7.9 due to middleware deadlock in 0.8.x
# DO NOT UPGRADE without extensive testing of middleware composition with heterogeneous router states
# See: cortex/cortex/src/api/server.rs:374-414 for technical details
# Issue: ServiceBuilder wrapping causes request hang with merged sub-routers
axum = { version = "=0.7.9", features = ["macros"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }

# Database
sqlx = { version = "0.8.2", features = ["runtime-tokio", "sqlite"] }
surrealdb = { version = "2.1.1", features = ["kv-mem", "kv-rocksdb"] }

# Configuration
config = "0.15.18"
toml = "0.9.8"

# CLI
clap = { version = "4.5.22", features = ["derive", "env"] }

# Utilities
uuid = { version = "1.11.0", features = ["serde", "v4"] }
chrono = { version = "0.4.39", features = ["serde"] }
time = { version = "0.3.37", features = ["serde", "macros"] }
dashmap = "6.1.0"
parking_lot = "0.12.5"
once_cell = "1.21.3"
tempfile = "3.23.0"
regex = "1.12.2"
unicode-segmentation = "1.12.0"
crossbeam = "0.8.4"
rayon = "1.10.0"
dirs = "6.0.0"

# Hashing and crypto
blake3 = "1.5.5"
sha2 = "0.10.8"

# Embeddings and ML
ort = { version = "1.16.3", features = ["load-dynamic"] }
tokenizers = { version = "0.19.1", default-features = false, features = ["onig"] }


# File watching
notify = "8.2.0"
ignore = "0.4.25"

# Testing
mockall = "0.13.1"
proptest = "1.9.0"

# Benchmarking
criterion = { version = "0.7.0", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
